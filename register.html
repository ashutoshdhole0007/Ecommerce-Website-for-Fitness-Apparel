<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | AlphaFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark alpha-nav sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">AlphaFit</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Shop</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 nav-auth">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-alpha" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="auth-wrap">
            <form class="auth-card" id="register-form">
                <p class="eyebrow">Join AlphaFit</p>
                <h1>Create account</h1>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="reg-username" placeholder="Choose a username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="reg-email" placeholder="Enter email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="reg-password" placeholder="Choose a password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="reg-password2" placeholder="Confirm password" required>
                </div>
                <button class="btn btn-alpha w-100" type="submit">Register</button>
                <p class="mt-3 mb-0">Already a member? <a href="login.html">Login</a></p>
            </form>
        </section>
    </main>

    <footer class="py-4 mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
            <span>AlphaFit performance wear</span>
            <span>Train harder. Move sharper.</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
