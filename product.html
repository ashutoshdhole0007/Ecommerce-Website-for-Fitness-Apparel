<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product | AlphaFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark alpha-nav sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">AlphaFit</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Shop</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 nav-auth">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-alpha" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="container py-5">
            <div class="row g-5 align-items-center" id="product-detail">
                <div class="col-lg-6">
                    <img class="detail-img" src="" alt="" onerror="this.onerror=null;this.src='images/product-placeholder.svg';">
                </div>
                <div class="col-lg-6">
                    <p class="eyebrow" id="product-category"></p>
                    <h1 class="detail-title" id="product-name"></h1>
                    <p class="detail-copy" id="product-description"></p>
                    <p class="price" id="product-price"></p>
                    <button class="btn btn-alpha btn-lg" id="add-to-cart-btn">Add to Cart</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-4 mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
            <span>AlphaFit performance wear</span>
            <span>Train harder. Move sharper.</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Load product and render detail page
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');

        if (!productId) {
            document.getElementById('product-detail').innerHTML = '<div class="col-12"><div class="empty-state"><h3>Product not found</h3></div></div>';
        } else {
            const product = PRODUCTS.find(p => p.id === parseInt(productId));
            if (!product) {
                document.getElementById('product-detail').innerHTML = '<div class="col-12"><div class="empty-state"><h3>Product not found</h3></div></div>';
            } else {
                document.querySelector('.detail-img').src = product.image_url;
                document.querySelector('.detail-img').alt = product.name;
                document.getElementById('product-category').textContent = product.category;
                document.getElementById('product-name').textContent = product.name;
                document.getElementById('product-description').textContent = product.description;
                document.getElementById('product-price').textContent = 'Rs. ' + product.price;

                document.getElementById('add-to-cart-btn').addEventListener('click', function() {
                    addToCart(product.id);
                    showMessage(product.name + ' added to your cart.');
                });
            }
        }
    </script>
</body>
</html>
