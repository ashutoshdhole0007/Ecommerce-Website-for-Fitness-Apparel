<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart | AlphaFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark alpha-nav sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">AlphaFit</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Shop</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 nav-auth">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-alpha" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="container py-5">
            <p class="eyebrow">Your Cart</p>
            <h1 class="section-title mb-4">Ready for checkout</h1>

            <div id="cart-container">
                <!-- Cart items rendered by JS -->
            </div>
        </section>
    </main>

    <footer class="py-4 mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
            <span>AlphaFit performance wear</span>
            <span>Train harder. Move sharper.</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Render cart from PRODUCTS array
        const { items, total } = getCartItems(PRODUCTS);
        const container = document.getElementById('cart-container');

        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>Your cart is empty</h3>
                    <p>Pick your next training essential from the AlphaFit collection.</p>
                    <a class="btn btn-alpha" href="index.html">Shop Now</a>
                </div>
            `;
        } else {
            const rows = items.map(item => `
                <div class="cart-row">
                    <img src="${item.product.image_url}" alt="${item.product.name}" onerror="this.onerror=null;this.src='images/product-placeholder.svg';">
                    <div>
                        <h2>${item.product.name}</h2>
                        <p>Qty ${item.quantity} x Rs. ${item.product.price}</p>
                    </div>
                    <strong>Rs. ${item.subtotal.toFixed(2)}</strong>
                    <form method="post" action="#" onsubmit="event.preventDefault(); removeFromCart(${item.product.id}); location.reload();">
                        <button class="btn btn-sm btn-outline-light" type="submit">Remove</button>
                    </form>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="cart-panel">
                    ${rows}
                    <div class="cart-total">
                        <span>Total</span>
                        <strong>Rs. ${total.toFixed(2)}</strong>
                    </div>
                    <div class="p-3 pt-0 text-end">
                        <a class="btn btn-alpha btn-lg" href="checkout.html">Proceed to Checkout</a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
