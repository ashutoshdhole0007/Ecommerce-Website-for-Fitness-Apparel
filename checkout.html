<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout | AlphaFit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark alpha-nav sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">AlphaFit</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Shop</a></li>
                </ul>
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 nav-auth">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-alpha" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="container py-5">
            <p class="eyebrow">Checkout</p>
            <h1 class="section-title mb-4">Delivery details</h1>

            <div class="row g-4">
                <div class="col-lg-7">
                    <form class="checkout-panel" id="checkout-form">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="full-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" id="address" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" id="city" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pincode</label>
                            <input type="text" class="form-control" id="pincode" required>
                        </div>
                        <button class="btn btn-alpha btn-lg w-100" type="submit">Continue to Payment</button>
                    </form>
                </div>
                <div class="col-lg-5">
                    <div class="checkout-panel">
                        <h2 class="summary-title">Order Summary</h2>
                        <div id="order-summary"></div>
                        <div class="summary-total">
                            <span>Total</span>
                            <strong id="checkout-total"></strong>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-4 mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
            <span>AlphaFit performance wear</span>
            <span>Train harder. Move sharper.</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Render order summary from PRODUCTS array
        const { items, total } = getCartItems(PRODUCTS);
        const summary = document.getElementById('order-summary');

        if (items.length === 0) {
            summary.innerHTML = '<p class="text-secondary">Your cart is empty.</p>';
        } else {
            summary.innerHTML = items.map(item => `
                <div class="summary-row">
                    <span>${item.product.name} x ${item.quantity}</span>
                    <strong>Rs. ${item.subtotal.toFixed(2)}</strong>
                </div>
            `).join('');
        }

        document.getElementById('checkout-total').textContent = 'Rs. ' + total.toFixed(2);

        // Pre-fill name and email if logged in
        const user = getCurrentUser();
        if (user) {
            document.getElementById('full-name').value = user.username;
            if (user.email) {
                document.getElementById('email').value = user.email;
            }
        }

        // On submit, save checkout data and go to payment
        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const checkoutData = {
                full_name: document.getElementById('full-name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                pincode: document.getElementById('pincode').value,
            };
            // Store checkout data and order for payment page
            const orderData = { ...checkoutData, items, total };
            localStorage.setItem('alphafit_pending_order', JSON.stringify(orderData));
            window.location.href = 'payment.html';
        });
    </script>
</body>
</html>
